[project]
name = "rag-chatbot-backend"
version = "0.1.0"
description = "FastAPI backend for a RAG chatbot with hybrid retrieval, reranking and LangGraph"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "python-multipart>=0.0.17",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "fastembed>=0.4",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "langchain-text-splitters>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
