# Deploys the backend to Hugging Face Spaces.
#
# A Space is a free server that builds and runs a Dockerfile. It has its own git repo:
# every push to it rebuilds the app. This workflow pushes the backend/ folder there,
# but only after CI has passed on main (or when started by hand from the Actions tab).
#
# Needs, under Settings > Secrets and variables > Actions:
#   - secret   HF_TOKEN  a Hugging Face access token with write access to the Space
#   - variable HF_SPACE  the Space's name, e.g. your-username/rag-chatbot-api
name: Deploy backend

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer one cancels an older one still running.
concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    name: Push backend to Hugging Face
    # From CI: only when it passed, and only for a push (not a pull request).
    # Skipped (not failed) until the HF_SPACE variable exists.
    if: >-
      vars.HF_SPACE != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: huggingface
      url: https://huggingface.co/spaces/${{ vars.HF_SPACE }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy exactly the commit CI tested, not whatever is newest.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check the settings are there
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::error::Add the HF_TOKEN secret and the HF_SPACE variable under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Build the Space's files
        run: |
          mkdir space
          # The same files Docker would see (no tests, evals or caches).
          rsync -a backend/ space/ \
            --exclude .venv --exclude tests --exclude evals \
            --exclude __pycache__ --exclude .pytest_cache --exclude .ruff_cache \
            --exclude '.env*'
          # Hugging Face reads the Space's settings from the top of README.md.
          # app_port: the port our container listens on (the Dockerfile's PORT=8000).
          cat > space/README.md <<'EOF'
          ---
          title: RAG Chatbot API
          emoji: 📚
          colorFrom: indigo
          colorTo: blue
          sdk: docker
          app_port: 8000
          pinned: false
          short_description: Backend of a RAG chatbot (FastAPI + LangGraph)
          ---

          The API behind the RAG Chatbot. Source code, tests and docs:
          https://github.com/HuzaifaMoin/rag-chatbot

          Health check: `/api/health` · API docs: `/docs`
          EOF

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          cd space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${SHA::7} from GitHub"
          # --force: the Space is only a copy; GitHub is the real history.
          git push --force -q "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
          echo "Pushed. Hugging Face is now building: https://huggingface.co/spaces/${HF_SPACE}" >> "$GITHUB_STEP_SUMMARY"
