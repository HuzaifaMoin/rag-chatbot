# Runs on every push / pull request: lint + tests for the backend, lint + types + build for the
# frontend, the end-to-end test, and a check that the production Docker image starts.
# Needs no secrets: tests use a fake LLM and LangSmith tracing is switched off.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # adds a "Run workflow" button on GitHub

# Read-only: CI can read the code but can't change the repo.
permissions:
  contents: read

# If you push again while a run is still going, cancel the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    # A real Postgres + pgvector next to the job, same image as docker-compose.yml.
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5432/rag_test
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # The embedding model + reranker (~150 MB) download once, then come from this cache.
      - name: Cache embedding models
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.fastembed_cache
          key: fastembed-${{ hashFiles('backend/app/config.py') }}

      - name: Tests (unit + integration)
        run: uv run pytest -q

  frontend:
    name: Frontend (lint + types + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci

      - name: Lint
        run: npm run lint

      # Next.js generates some global types (e.g. LayoutProps) into .next/. A fresh checkout
      # doesn't have them yet, so generate them first.
      - name: Type-check
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache

    steps:
      - uses: actions/checkout@v7

      # Backend (Playwright starts it; it needs its packages and the models).
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Cache embedding models
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.fastembed_cache
          key: fastembed-${{ hashFiles('backend/app/config.py') }}

      # Frontend + browser.
      - name: Install Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium (and the system libraries it needs)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build the frontend
        working-directory: frontend
        run: npm run build

      - name: Run the end-to-end test
        working-directory: frontend
        run: npm run e2e

      # If it fails: screenshots, video and a step-by-step trace, downloadable from the run page.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  docker:
    name: Docker image (build + start)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t rag-backend backend

      # The safety check: production mode must refuse the dev JWT secret.
      - name: Refuses to start with an unsafe secret
        run: |
          if docker run --rm --network host -e GROQ_API_KEY=gsk_ci_dummy rag-backend > out.log 2>&1; then
            echo "::error::The image started without a real JWT_SECRET"; exit 1
          fi
          grep -q "needs a real JWT_SECRET" out.log  # it failed for the right reason
          echo "Refused, as it should."

      # --network host: the container reaches the Postgres service on localhost.
      # The Groq key is a dummy: starting up and making a demo account need no LLM.
      - name: Start the container
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql://rag:rag@localhost:5432/rag \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e GROQ_API_KEY=gsk_ci_dummy \
            -e LANGSMITH_TRACING=false \
            rag-backend

      - name: Health check and a demo account
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/api/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/api/health
          # Makes a guest with the handbook: proves the models and demo data are in the image.
          curl -sf -X POST http://localhost:8000/api/auth/guest | grep -q access_token
          echo "Image starts, connects to Postgres and creates demo accounts."

      - name: Container logs
        if: always()
        run: docker logs api || true
