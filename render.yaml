# Render "Blueprint": the backend's hosting setup, written down as code.
# On render.com: New > Blueprint > pick this repo. Render reads this file, asks for
# the values marked `sync: false`, and creates the service.
#
# Free plan: 512 MB memory, sleeps after ~15 min without visitors (the next request
# wakes it, which takes about a minute). The models' memory settings in
# backend/app/config.py are tuned to fit in 512 MB.
services:
  - type: web
    name: rag-chatbot-api
    runtime: docker
    plan: free
    region: virginia # next to the Neon database (AWS us-east-1)
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    # Deploy a new commit on main only after GitHub Actions (CI) has passed on it.
    autoDeployTrigger: checksPass
    envVars:
      # Secrets: Render asks for these when the Blueprint is created.
      - key: DATABASE_URL # Neon's unpooled connection string
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      # A random 256-bit value made by Render, never seen by anyone.
      - key: JWT_SECRET
        generateValue: true
      # Not secret.
      - key: CORS_ORIGINS
        value: https://rag-chatbot-six-psi.vercel.app,http://localhost:3000
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_ENDPOINT
        value: https://api.smith.langchain.com
      - key: LANGSMITH_AGENT_ID
        value: rag
      - key: LANGSMITH_AGENT_ENVIRONMENT
        value: production
